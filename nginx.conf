server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff|woff2|svg|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to Frappe backend
    location /api/ {
        proxy_pass https://muri.osaz.si/api/;
        proxy_http_version 1.1;
        proxy_set_header Host muri.osaz.si;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Expect "";
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    # Proxy private files to Frappe backend
    location /private/ {
        proxy_pass https://muri.osaz.si/private/;
        proxy_http_version 1.1;
        proxy_set_header Host muri.osaz.si;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Expect "";
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    # Proxy public files to Frappe backend
    location /files/ {
        proxy_pass https://muri.osaz.si/files/;
        proxy_http_version 1.1;
        proxy_set_header Host muri.osaz.si;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
